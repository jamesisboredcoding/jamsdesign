[package]
name = "blobr"
description = "Blobr, the jamsdesign interface and vector design app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
jd-core.workspace = true
jd-ui.workspace = true
jd-vector = { path = "../../../crates/jd-vector" }
jd-vector-render = { path = "../../../crates/jd-vector-render" }
# The MCP tools, run live on the open document when an agent connects.
blobr-mcp = { path = "../blobr-mcp" }
jd-mcp = { path = "../../../crates/jd-mcp" }
serde_json.workspace = true
iced.workspace = true
iced_runtime.workspace = true
rfd.workspace = true
kurbo = "0.11"
tiny-skia = "0.11"
# The system clipboard (text and images), Wayland via data-control.
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
# Rasterises the app logo for the window icon (same version iced uses).
resvg = { version = "0.45", default-features = false }
