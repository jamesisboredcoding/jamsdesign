[package]
name = "photosplash"
description = "Photosplash, the jamsdesign photo editor."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
jd-core.workspace = true
jd-raster.workspace = true
jd-ui.workspace = true
iced.workspace = true
# Rasterises the app logo for the window icon (same version iced uses).
image.workspace = true
resvg = { version = "0.45", default-features = false }
jd-io.workspace = true
jd-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
# The system clipboard (images and text), Wayland via data-control.
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
jd-gpu.workspace = true
rfd.workspace = true
octotablet.workspace = true
raw-window-handle.workspace = true
iced_winit.workspace = true
